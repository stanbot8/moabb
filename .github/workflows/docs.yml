name: Docs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref 
    }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' || 
    github.run_attempt > 1) && (true) }}


on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Install CPU-only PyTorch wheels (torch arrives transitively via the
  # deeplearning extra -> braindecode). Avoids pulling CUDA builds on CI.
  UV_TORCH_BACKEND: cpu

jobs:
  build_docs:
    runs-on: ${{ matrix.os }}
    env:
      MNE_DATA: ${{ github.workspace }}/mne_data
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && '3888687e0781a81adff6b2903e3568407839b6c9' || 
            github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Restore MNE Data Cache
        id: cache-mne_data
        uses: actions/cache/restore@v4
        with:
          path: |
            mne_data
            ~/.mne
          key: doc-${{ runner.os }}-mne-data-v3
          restore-keys: |
            doc-${{ runner.os }}-mne-data-v3-

      - name: Clean up corrupted cache
        run: |
          echo "Cache hit: ${{ steps.cache-mne_data.outputs.cache-hit }}"
          echo "Cache matched key: ${{ steps.cache-mne_data.outputs.cache-matched-key }}"
          mkdir -p mne_data
          # Remove any incomplete extractions (e.g., BIDS.zip.unzip alongside final folder)
          if [ -d mne_data/BIDS.zip.unzip ]; then
            echo "Removing incomplete extraction: BIDS.zip.unzip"
            rm -rf mne_data/BIDS.zip.unzip
          fi
          if [ -d mne_data/MNE-RomaniBF2025ERP-data ] && [ -f mne_data/MNE-RomaniBF2025ERP-data/.cache-incomplete ]; then
            echo "Removing incomplete BrainForm dataset"
            rm -rf mne_data/MNE-RomaniBF2025ERP-data
          fi
          # Remove stale evaluation results to avoid race conditions
          # between parallel sphinx-gallery examples sharing HDF5 files
          if [ -d ~/mne_data/results ]; then
            echo "Removing stale evaluation results"
            rm -rf ~/mne_data/results
          fi

      - name: Cache docs build
        id: cache-docs
        uses: actions/cache@v3
        with:
          key: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/build

      - name: Install moabb
        run: |
          uv pip install -e .[docs,deeplearning,optuna,external,carbonemission]
          uv pip install google-auth requests

      - name: Export GA4 page views snapshot
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          python .github/scripts/export_ga4_pageviews.py \
            --output docs/source/_static/analytics/pageviews.json

      - name: Configure MOABB download directory
        run: |
          python -c "
          from moabb.utils import set_download_dir
          from mne import set_config
          import os
          mne_data = os.environ['MNE_DATA']
          set_download_dir(mne_data)
          set_config('MOABB_RESULTS', mne_data)
          print(f'MNE_DATA set to: {mne_data}')
          "

      - name: Pre-download datasets (cold cache only)
        if: steps.cache-mne_data.outputs.cache-matched-key == ''
        run: |
          echo "Cache is cold, pre-downloading datasets with delays to avoid rate limiting..."
          python << 'EOF'
          import os
          import sys
          import time
          from moabb.utils import set_download_dir
          set_download_dir(os.environ["MNE_DATA"])

          # All datasets used in examples that download from Zenodo
          # Each entry: (module_path, class_name, subjects)
          #   subjects can be an int (first N) or a list of specific subject IDs
          datasets_to_download = [
              ('moabb.datasets', 'BNCI2014_001', 3),
              ('moabb.datasets', 'BNCI2014_009', 2),
              ('moabb.datasets', 'Zhou2016', 4),  # All 4 subjects
              ('moabb.datasets', 'AlexMI', 1),
              ('moabb.datasets', 'Kalunga2016', 2),
              ('moabb.datasets', 'Cattan2019_VR', 1),
              ('moabb.datasets', 'Hinss2021', 1),
              ('moabb.datasets', 'Dreyer2023A', [1, 5, 7, 35]),  # plot_dreyer example
          ]

          failed = []
          for module_path, class_name, subj_spec in datasets_to_download:
              if isinstance(subj_spec, list):
                  subjects_label = f"subjects {subj_spec}"
              else:
                  subjects_label = f"{subj_spec} subjects"
              print(f'\n{"="*60}')
              print(f'Pre-downloading {class_name} ({subjects_label})...')
              print(f'{"="*60}')
              success = False
              for attempt in range(5):  # More retries
                  try:
                      import importlib
                      module = importlib.import_module(module_path)
                      cls = getattr(module, class_name)
                      ds = cls()
                      if isinstance(subj_spec, list):
                          subjects = subj_spec
                      else:
                          subjects = ds.subject_list[:subj_spec]
                      ds.download(subject_list=subjects)
                      print(f'SUCCESS: {class_name} downloaded ({subjects_label})')
                      success = True
                      break
                  except Exception as e:
                      print(f'Attempt {attempt + 1}/5 failed: {e}')
                      if attempt < 4:
                          wait = 90 * (attempt + 1)  # 90s, 180s, 270s, 360s
                          print(f'Waiting {wait}s before retry...')
                          time.sleep(wait)
              if not success:
                  failed.append(class_name)
                  print(f'FAILED: {class_name} after 5 attempts')
              # Wait between datasets to avoid rate limiting
              print('Waiting 60s before next dataset...')
              time.sleep(60)

          if failed:
              print(f'\n{"="*60}')
              print(f'ERROR: Failed to download: {", ".join(failed)}')
              print(f'{"="*60}')
              sys.exit(1)
          else:
              print(f'\n{"="*60}')
              print('All datasets downloaded successfully!')
              print(f'{"="*60}')
          EOF

      - name: Build docs
        env:
          # Disable parallel builds when cache is cold to avoid Zenodo rate limiting
          SPHINX_GALLERY_PARALLEL: ${{ 
            steps.cache-mne_data.outputs.cache-matched-key != '' }}
          SPHINX_JOBS: ${{ steps.cache-mne_data.outputs.cache-matched-key != '' 
            && 'auto' || '1' }}
        run: |
          echo "Cache hit: ${{ steps.cache-mne_data.outputs.cache-hit }}"
          echo "Cache matched key: ${{ steps.cache-mne_data.outputs.cache-matched-key }}"
          echo "Parallel gallery builds: $SPHINX_GALLERY_PARALLEL"
          echo "Sphinx jobs: $SPHINX_JOBS"
          # Pre-create .mne directory to avoid race condition when parallel
          # gallery examples call mne.set_config() simultaneously
          mkdir -p ~/.mne
          cd docs && make html

      - name: Generate notebooks from examples (Colab)
        run: |
          set -euo pipefail
          echo "Converting Python examples to notebooks in docs/build/html/auto_examples/_notebooks..."
          mkdir -p docs/build/html/auto_examples/_notebooks
          find examples -type f -name '*.py' | while read -r f; do
            rel="${f#examples/}"
            out_dir="docs/build/html/auto_examples/_notebooks/$(dirname "$rel")"
            mkdir -p "$out_dir"
            base="$(basename "$rel" .py)"
            out_path="$out_dir/$base.ipynb"
            python .github/scripts/convert_to_notebook.py --input "$f" --output "$out_path"
          done

      - name: Save MNE Data Cache
        if: success() && steps.cache-mne_data.outputs.cache-hit != 'true' && 
          github.event_name == 'push' && (((github.event_name == 'schedule' || 
          github.event_name == 'workflow_run') && 'refs/heads/develop' || 
          github.ref) == 'refs/heads/develop' || ((github.event_name == 
          'schedule' || github.event_name == 'workflow_run') && 
          'refs/heads/develop' || github.ref) == 'refs/heads/master')
        uses: actions/cache/save@v4
        with:
          path: |
            mne_data
            ~/.mne
          key: doc-${{ runner.os }}-mne-data-v3

      # Create an artifact of the html output.
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentationHTML
          path: docs/build/html/

    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  deploy_neurotechx:
    if: |-
      ${{ (((github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'refs/heads/develop' || github.ref) == 'refs/heads/develop') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    needs:
      - build_docs
      - alpha_bridge_inputs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && '3888687e0781a81adff6b2903e3568407839b6c9' || 
            github.sha }}
      - name: Restore cached docs build
        id: cache-docs
        uses: actions/cache/restore@v3
        with:
          key: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/build

      - name: Check cache hit
        if: steps.cache-docs.outputs.cache-hit != 'true'
        run: |-
          exit 1


      - name: Deploy Neurotechx Subpage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: NeuroTechX/moabb.github.io
          destination_dir: docs/
          publish_branch: master
          publish_dir: ./docs/build/html
          cname: moabb.neurotechx.com/

  deploy_gh_pages:
    if: |-
      ${{ (((github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'refs/heads/develop' || github.ref) == 'refs/heads/develop') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    needs:
      - build_docs
      - alpha_bridge_inputs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && '3888687e0781a81adff6b2903e3568407839b6c9' || 
            github.sha }}
      - name: Restore cached docs build
        id: cache-docs
        uses: actions/cache/restore@v3
        with:
          key: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/build

      - name: Check cache hit
        if: steps.cache-docs.outputs.cache-hit != 'true'
        run: |-
          exit 1


      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          deploy_key: ${{ secrets.MOABB_DEPLOY_KEY_NEW }}
          destination_dir: docs/
          publish_branch: gh-pages
          publish_dir: ./docs/build/html
          cname: neurotechx.github.io/moabb/
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
      - id: identity
        name: Check source, workflow, variables, and runner inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AB_REPOSITORY: ${{ github.repository }}
          AB_RUN_ID: ${{ github.run_id }}
          AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name
            == 'workflow_run') && '3888687e0781a81adff6b2903e3568407839b6c9' || 
            github.sha }}
          AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'refs/heads/develop' || github.ref }}
          AB_WORKFLOW_DIGEST: 
            f4978acd3b2066bbf1c7d3b5597930623c9b22a40315456c1b2992ce73586f22
          AB_EVENT: ${{ github.event_name }}
          AB_SCHEDULE: ${{ github.event.schedule || '' }}
          AB_VARIABLES: ${{ toJSON(vars) }}
          AB_INPUTS: ${{ toJSON(inputs) }}
          AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        shell: bash
        run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
          embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
          annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
          re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
          CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES
          = (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef input_identity(job):\n\
          \    for step in job.get(\"steps\", []):\n        if step.get(\"conclusion\"\
          ) != \"success\":\n            continue\n        name = step.get(\"name\"\
          , \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n            if
          name.startswith(prefix):\n                identity = name.removeprefix(prefix)\n\
          \                if re.fullmatch(r\"[0-9a-f]{64}\", identity):\n       \
          \             return identity\n    return \"\"\n\n\ndef parent_has_work(get,
          repository, parent):\n    if (\n        not parent\n        or parent.get(\"\
          head_branch\") != \"alpha-bridge-ci\"\n        or parent.get(\"status\"\
          ) != \"completed\"\n    ):\n        return True\n    sha = parent[\"head_sha\"\
          ]\n    if re.fullmatch(r\"[0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"\
          parent workflow has no exact configuration commit\")\n    record = get(f\"\
          /repos/{repository}\")\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
          )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n\
          \    if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
          schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
          ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
          ValueError(\"parent CI configuration has no verified fork ownership\")\n\
          \    path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
          .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
          ):\n        raise ValueError(\"parent workflow path is outside its configuration
          owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
          safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
          content\"])).hexdigest() != marker.get(\n        \"definition_sha256\",
          {}\n    ).get(path):\n        raise ValueError(\"parent workflow differs
          from its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
          :\n        return False\n    jobs = []\n    page = 1\n    while True:\n\
          \        values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
          \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
          < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
          \        for job in jobs\n        if job.get(\"name\") in INPUT_CHECK_NAMES\n\
          \        and job.get(\"conclusion\") == \"success\"\n        and input_identity(job)\n\
          \    ]\n    return not guards or any(\n        job not in guards and job.get(\"\
          conclusion\") != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get,
          *, repository, run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
          )\n    event = current[\"event\"]\n    page = 1\n    while True:\n     \
          \   # Filter locally: GitHub caps filtered searches at 1,000 results.\n\
          \        query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
          \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
          )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
          ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
          ) != current[\"head_branch\"] or run.get(\"event\") != event:\n        \
          \        continue\n            job_page = 1\n            while True:\n \
          \               jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
          \n                )[\"jobs\"]\n                for job in jobs:\n      \
          \              if (\n                        (\n                       \
          \     job[\"name\"] in INPUT_CHECK_NAMES\n                            if
          job_name in INPUT_CHECK_NAMES\n                            else job[\"name\"\
          ] == job_name\n                        )\n                        and job.get(\"\
          status\") == \"completed\"\n                        and job.get(\"conclusion\"\
          ) == \"success\"\n                        and input_identity(job) == identity\n\
          \                    ):\n                        return False\n        \
          \        if len(jobs) < 100:\n                    break\n              \
          \  job_page += 1\n        if len(runs[\"workflow_runs\"]) < 100:\n     \
          \       return True\n        page += 1\n\n\ndef main():\n    event = os.environ[\"\
          AB_EVENT\"]\n    event_payload = None\n    if event not in {\"schedule\"\
          , \"workflow_run\"}:\n        with open(os.environ[\"GITHUB_EVENT_PATH\"\
          ], encoding=\"utf-8\") as payload_file:\n            event_payload = json.load(payload_file)\n\
          \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
          \        \"source_ref\": os.environ[\"AB_REF\"],\n        \"workflow_definition\"\
          : os.environ[\"AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n     \
          \   \"event_payload\": event_payload,\n        \"schedule\": os.environ[\"\
          AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
          ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n      \
          \  \"runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"\
          ImageVersion\", \"\")],\n        \"producer\": json.loads(os.environ.get(\"\
          AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs,
          sort_keys=True).encode()).hexdigest()\n\n    def get(path):\n        request
          = urllib.request.Request(\n            \"https://api.github.com\" + path,\n\
          \            headers={\n                \"Authorization\": \"Bearer \" +
          os.environ[\"GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
          ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n         \
          \   },\n        )\n        with urllib.request.urlopen(request, timeout=60)
          as response:\n            return json.load(response)\n\n    manual = event
          == \"workflow_dispatch\" or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n\
          \    should_run = manual or (\n        (\n            inputs[\"event\"]
          != \"workflow_run\"\n            or parent_has_work(get, os.environ[\"AB_REPOSITORY\"\
          ], inputs[\"producer\"])\n        )\n        and changed(\n            get,\n\
          \            repository=os.environ[\"AB_REPOSITORY\"],\n            run_id=int(os.environ[\"\
          AB_RUN_ID\"]),\n            identity=identity,\n            job_name=\"\
          CI input check\",\n        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"\
          ], \"a\", encoding=\"utf-8\") as output:\n        output.write(f\"digest={identity}\\\
          nchanged={str(should_run).lower()}\\n\")\n    print(\n        \"Explicit
          CI run requested\"\n        if manual\n        else \"CI inputs changed\"\
          \n        if should_run\n        else \"CI inputs unchanged; build and test
          jobs skipped\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n\n\
          ALPHA_BRIDGE_CI_PY\n"
      - name: CI input identity ${{ steps.identity.outputs.digest }}
        run: echo 'Input identity recorded'
